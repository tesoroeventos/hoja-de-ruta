<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1E21">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hoja de ruta · Tesoro Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#1C1E21;--p1:#25282C;--p2:#2F3337;--ln:#3B4046;--tx:#ECEDEE;--mu:#9AA0A6;
  --lime:#C3D118;--amb:#E8A33D;--red:#F0575C;
  --fd:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --fb:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:16px;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{font-family:var(--fd);font-weight:700;font-size:24px;letter-spacing:.4px;color:var(--lime);flex:1}
.brand small{display:block;font-family:var(--fb);font-weight:500;font-size:12px;color:var(--mu);letter-spacing:0}
h1.t{font-family:var(--fd);font-weight:700;font-size:23px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{background:none;border:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--tx);font-size:20px;cursor:pointer}
.icon:active{background:var(--p2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 10px 8px;max-width:760px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;color:var(--mu);font-weight:600;font-size:15px;padding:7px 13px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--lime);color:#1C1E21}
main{padding-top:16px}
h2{font-family:var(--fd);font-weight:700;font-size:21px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
.hint{color:var(--mu);font-size:14px;line-height:1.4;margin:-4px 0 12px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--mu);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--p1);border:1px solid var(--ln);border-radius:9px;padding:11px 12px;outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--lime)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--p2);color:var(--tx)}
.btn.pri{background:var(--lime);color:#1C1E21}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.danger{background:none;color:var(--red);border:1px solid #5a3033}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.evcard{display:block;width:100%;text-align:left;cursor:pointer}
.evcard .n{font-family:var(--fd);font-weight:700;font-size:22px}
.evcard .m{color:var(--mu);font-size:14px;margin-top:2px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;margin-top:8px}
.pill.amb{background:#4a3a1c;color:var(--amb)}
.pill.ok{background:#39401a;color:var(--lime)}
.pend{border-left:3px solid var(--amb);background:#2b2720;border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:14px}
.pend b{color:var(--amb)}
.pend ul{margin:6px 0 0;padding-left:18px;color:#d8d2c4}
.lrow{display:grid;grid-template-columns:1fr 96px;gap:6px;margin-bottom:6px}
.lrow .tx{grid-column:1/-1}
.lrow .x{grid-column:1/-1;display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:13px;color:var(--mu)}
.chk{display:flex;align-items:center;gap:6px}
.chk input{width:18px;height:18px;accent-color:var(--amb)}
.mini{background:none;border:1px solid var(--ln);border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--mu);font-size:13px}
.people{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-bottom:6px}
.paper{background:#fff;border-radius:10px;overflow:hidden;margin:8px 0}
.paper svg{display:block;width:100%;height:auto}
#planoBox{touch-action:none;user-select:none;-webkit-user-select:none}
.palette{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.palette button{flex:none;border:1px solid var(--ln);background:var(--p1);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.selp{border-color:var(--lime)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fx{width:52px;border:2px solid transparent;border-radius:10px;padding:5px 0 4px;text-align:center;cursor:pointer;line-height:1.1}
.fx .n{font-size:11px;opacity:.85}
.fx .s{font-family:var(--fd);font-weight:700;font-size:19px}
.fx .a{font-size:11px;font-weight:600}
.fx.bad{border-color:var(--red);box-shadow:0 0 0 2px #1C1E21 inset}
.fx.noaddr .a{opacity:.6}
.banner{background:#3a2023;border:1px solid #6b2f33;color:#ffb3b5;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.ghead{display:flex;gap:6px;align-items:center;margin:16px 0 6px}
.ghead input{font-weight:600;background:none;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:6px 2px}
.irow{display:grid;grid-template-columns:1fr 64px auto;gap:6px;margin-bottom:6px}
.auto{color:var(--mu);font-size:14px}
.auto div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--ln)}
.libro{display:grid;grid-template-columns:44px 1fr 54px 76px auto;gap:6px;align-items:center;margin-bottom:8px}
.libro input[type=color]{width:44px;height:44px;border:1px solid var(--ln);border-radius:9px;background:var(--p1);padding:3px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.bottom .wrap{display:flex;gap:8px;padding:0}
.bottom .btn{flex:1;padding:14px;font-size:16px}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--p1);border-top:1px solid var(--ln);border-radius:16px 16px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;background:var(--ln);border-radius:4px;margin:4px auto 12px}
#sheet h3{font-family:var(--fd);font-size:22px;margin:0 0 12px}
.stack{display:grid;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:#ECEDEE;color:#1C1E21;
  padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.empty b{display:block;color:var(--tx);font-family:var(--fd);font-size:22px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar" id="topbar"></div><div class="tabs" id="tabs"></div></header>
<main class="wrap" id="app"></main>
<div class="bottom" id="bottom"></div>
<div id="sheetBg" data-a="closeSheet"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="fileFoto" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>

<script>
'use strict';
/* ================= Datos ================= */
const LS = 'tesoro_hojaruta_v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad3 = n => String(n).padStart(3, '0');
const r1 = n => Math.round(n * 10) / 10;

const TIPOS = {
  tarima:  {n:'Tarima',  cat:'estructura', w:6,   h:2},
  pantalla:{n:'Pantalla',cat:'pantalla',   w:5,   h:0.4},
  pa:      {n:'PA',      cat:'sonido',     w:0.8, h:0.8},
  sub:     {n:'Sub',     cat:'sonido',     w:0.8, h:0.8},
  demora:  {n:'Demora',  cat:'sonido',     w:0.6, h:0.6},
  monitor: {n:'Monitor', cat:'sonido',     w:0.7, h:0.5},
  control: {n:'Control', cat:'control',    w:3,   h:1.5},
  dj:      {n:'DJ',      cat:'control',    w:2,   h:1},
  tablero: {n:'Tablero', cat:'energia',    w:0.8, h:0.6},
  usina:   {n:'Usina',   cat:'energia',    w:1.8, h:1},
  truss:   {n:'Truss',   cat:'truss',      w:0.3, h:6},
  zona:    {n:'Texto',   cat:'zona',       w:3,   h:1},
};
const CAT = {
  sonido:{c:'#D85A30',n:'Sonido'}, pantalla:{c:'#534AB7',n:'Pantalla'}, control:{c:'#0F6E56',n:'Control'},
  energia:{c:'#BA7517',n:'Energía'}, truss:{c:'#888780',n:'Truss'}, estructura:{c:'#B4B2A9',n:'Tarima'}, zona:{c:'#9A9890',n:''}
};

const REGLAS_DEF = [
  'El responsable toma las decisiones en el lugar. Si hay que cambiar algo, lo define él.',
  'Todo equipo colgado va con su safety colocada.',
  'Avisar al grupo en cada paso: carga lista, llegada, armado OK, prueba OK.',
  'Al terminar el evento: novedades al grupo (roturas, faltantes, problemas).'
];
const CHECK_DEF = [
  'Energía conectada y tensión controlada',
  'Estructuras armadas y niveladas',
  'Luces colgadas según la planta, con safety en cada una',
  'Luces con su address y probadas desde la consola',
  'Sonido funcionando',
  'Pantalla armada y probada con contenido',
  'Foto del armado completo al grupo + "ARMADO OK"'
];

function seed() {
  const biblioteca = [
    {id:'beam',   nombre:'Beam',   sigla:'B', color:'#7F77DD', canales:null},
    {id:'nebula', nombre:'Nebula', sigla:'N', color:'#1D9E75', canales:null},
    {id:'bigpar', nombre:'BigPar', sigla:'P', color:'#EF9F27', canales:null},
    {id:'strobo', nombre:'Strobo', sigla:'S', color:'#D85A30', canales:null},
  ];
  const A = ['bigpar','nebula','beam','nebula','bigpar'], B = ['nebula','nebula','beam','nebula','nebula'];
  const seq = [...A, ...A, ...B, ...A, ...A, ...B, ...A, ...A];
  const fx = t => ({id:uid(), lib:t, u:1, a:null});
  const it = (t, x, y, w, h, label, fase) => ({id:uid(), t, x, y, w, h, label:label||'', fase:fase||''});
  const tecmaco = {
    id: uid(), nombre:'Tecmaco', fecha:'2026-09-25', cliente:'Tecmaco (evento corporativo)', lugar:'Carpa de 20 m en Tecmaco',
    direccion:'', contacto:'', servicio:'Sonido, iluminación y pantalla LED',
    reglas:[
      'Nico toma las decisiones en el lugar. Si hay que cambiar algo, lo define él.',
      'Es una empresa: llevar DNI y respetar las indicaciones de seguridad de Tecmaco.',
      'Todo equipo colgado del truss va con su safety colocada.',
      'Avisar al grupo en cada paso: carga lista, llegada, armado OK, prueba OK.',
      'Al terminar el evento: novedades al grupo (roturas, faltantes, problemas).'
    ],
    cronograma:[
      {dia:'Jue 24/09', hora:'09:00', texto:'Carga en depósito', conf:false},
      {dia:'', hora:'', texto:'Traslado a Tecmaco y armado completo (hasta terminar)', conf:false},
      {dia:'', hora:'', texto:'Al terminar: foto del armado al grupo + "ARMADO OK"', conf:false},
      {dia:'Vie 25/09', hora:'', texto:'Llegada del equipo técnico y prueba general', conf:true},
      {dia:'', hora:'18:30', texto:'Inicio del evento', conf:false},
      {dia:'', hora:'', texto:'Fin del evento y desarme', conf:true},
    ],
    responsable:'Nico', armado:['Nico','Juani','Lean','Facu','Augusto'],
    durante:[{nombre:'Nico', tarea:'Luces y pantalla'}, {nombre:'Javier', tarea:'DJ'}],
    plano:{ancho:15, largo:20, fondo:null, items:[
      it('pantalla', 5, 0.7, 5, 0.4, 'Pantalla LED 5x3'),
      it('tarima', 4.5, 1.4, 6, 2, 'Tarima'),
      it('pa', 3.7, 2, 0.8, 0.8, 'QSC 1'),
      it('pa', 10.5, 2, 0.8, 0.8, 'QSC 2'),
      it('control', 0.5, 3.8, 3.4, 1.8, 'Control (DJ, DM3, luces, pantalla)'),
      it('tablero', 0.2, 0.2, 0.9, 0.7, 'Tablero 3F'),
      it('usina', -3.1, 0.1, 2.2, 1, 'Usina 3F'),
      it('truss', 7.35, 3.7, 0.3, 14, 'Truss 14 m'),
      it('demora', 0.6, 10.5, 0.6, 0.6, 'EV'),
      it('demora', 13.8, 10.5, 0.6, 0.6, 'EV'),
      it('zona', 2, 14, 3, 1, 'Público'),
      it('zona', 10, 14, 3, 1, 'Público'),
    ]},
    estructuras:[
      {id:uid(), nombre:'Truss central', tipo:'truss', largo:14, aparejos:4, fx:seq.map(fx)},
      {id:uid(), nombre:'Grúa', tipo:'grupo', largo:0, aparejos:0, fx:[...Array(4)].map(()=>fx('beam')).concat([...Array(8)].map(()=>fx('strobo')))},
    ],
    equipos:[
      {g:'Sonido', n:'PA QSC (QSC 1 y QSC 2)', c:'2'}, {g:'Sonido', n:'Demora EV chica', c:'2'}, {g:'Sonido', n:'Pie para EV', c:'2'},
      {g:'Estructuras', n:'Truss central (total 14 m)', c:'14 m'}, {g:'Estructuras', n:'Aparejos', c:'4'},
      {g:'Pantalla', n:'Pantalla LED 5x3 m', c:'1'}, {g:'Pantalla', n:'Truss con patas para pantalla', c:'1'},
      {g:'Control y energía', n:'Consola de sonido DM3', c:'1'}, {g:'Control y energía', n:'Rack de micrófonos Shure', c:'1'},
      {g:'Control y energía', n:'Tablero trifásico', c:'1'}, {g:'Control y energía', n:'Usina trifásica', c:'1'},
    ],
    checklist:[
      'Usina y tablero trifásico conectados, tensión controlada',
      'Truss colgado con los 4 aparejos y nivelado',
      'Luces colgadas según la planta, con safety en cada una',
      'Luces con su address y probadas desde la consola',
      'Pantalla armada en su truss con patas y probada con contenido',
      'PA y demoras funcionando', 'Grúa iluminada y probada',
      'Foto del armado completo al grupo + "ARMADO OK"'
    ],
    actualizado: Date.now()
  };
  return {version:1, biblioteca, eventos:[tecmaco]};
}

function nuevoEvento() {
  return {
    id:uid(), nombre:'Nuevo evento', fecha:'', cliente:'', lugar:'', direccion:'', contacto:'', servicio:'',
    reglas:[...REGLAS_DEF],
    cronograma:[
      {dia:'', hora:'', texto:'Carga en depósito', conf:false},
      {dia:'', hora:'', texto:'Armado', conf:false},
      {dia:'', hora:'', texto:'Inicio del evento', conf:false},
      {dia:'', hora:'', texto:'Fin del evento y desarme', conf:false},
    ],
    responsable:'', armado:[], durante:[],
    plano:{ancho:15, largo:20, fondo:null, items:[]},
    estructuras:[], equipos:[], checklist:[...CHECK_DEF], actualizado:Date.now()
  };
}

let DB = (() => { try { const d = JSON.parse(localStorage.getItem(LS)); if (d && Array.isArray(d.eventos)) return d; } catch(e) {} return seed(); })();
let saveT;
function save() {
  const ev = curEv(); if (ev) ev.actualizado = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(DB)); }
  catch(e) { toast('No hay más espacio en el celular para guardar. Quitá la foto de fondo de algún plano.'); }
}
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 350); }

/* ================= Estado ================= */
const cur = {view:'home', evId:null, tab:'datos', sel:null, verPlanta:false};
const curEv = () => DB.eventos.find(e => e.id === cur.evId);
const libMap = () => Object.fromEntries(DB.biblioteca.map(l => [l.id, l]));

function allFx(ev) {
  const out = []; let n = 0;
  ev.estructuras.forEach((e, ei) => e.fx.forEach((f, fi) => out.push({f, e, ei, fi, n: ++n})));
  return out;
}
function conflictos(ev) {
  const L = libMap(), bad = new Set(), porU = {};
  allFx(ev).forEach(({f}) => {
    if (!f.a) return;
    const ch = (L[f.lib] && L[f.lib].canales) || 1;
    (porU[f.u || 1] = porU[f.u || 1] || []).push({id:f.id, a:+f.a, b:+f.a + ch - 1});
  });
  Object.values(porU).forEach(list => {
    list.sort((x, y) => x.a - y.a);
    for (let i = 1; i < list.length; i++) for (let j = i - 1; j >= 0; j--) {
      if (list[j].b >= list[i].a) { bad.add(list[i].id); bad.add(list[j].id); }
    }
    list.forEach(r => { if (r.b > 512) bad.add(r.id); });
  });
  return bad;
}
function pendientes(ev) {
  const p = [];
  if (!ev.direccion) p.push('Dirección del lugar');
  if (!ev.contacto) p.push('Contacto en el lugar');
  if (!ev.responsable) p.push('Responsable en el lugar');
  ev.cronograma.filter(c => c.conf).forEach(c => p.push('Horario: ' + (c.texto || 'sin detalle')));
  const fx = allFx(ev), sin = fx.filter(x => !x.f.a).length;
  if (sin) p.push(`${sin} de ${fx.length} luces sin address DMX`);
  const cf = conflictos(ev).size;
  if (cf) p.push(`${cf} luces con address superpuesto`);
  return p;
}
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
function fmtFecha(f) { if (!f) return 'Sin fecha'; const [y,m,d] = f.split('-').map(Number); const dt = new Date(y, m-1, d); return `${DIAS[dt.getDay()]} ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`; }

/* ================= Plano SVG ================= */
const S = 40, MG = 3.5;
const X = m => (MG + m) * S;

function itemSvg(it, o) {
  const T = TIPOS[it.t] || TIPOS.zona, cat = T.cat, col = CAT[cat].c;
  const w = it.w * S, h = it.h * S;
  let g = `<g data-id="${it.id}" transform="translate(${X(it.x)} ${X(it.y)})">`;
  if (o.editor) g += `<rect x="-10" y="-10" width="${w + 20}" height="${h + 20}" fill="transparent"/>`;
  let fill = col, stroke = 'none', tcol = '#fff', dash = '';
  if (cat === 'estructura') { fill = '#F1EFE8'; stroke = '#888780'; tcol = '#1A1A1A'; }
  if (cat === 'zona') { fill = 'none'; tcol = '#9A9890'; if (o.editor) { stroke = '#CFCDC6'; dash = 'stroke-dasharray="5 4"'; } }
  g += `<rect width="${w}" height="${h}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${dash}/>`;
  const label = it.label || T.n, fs = cat === 'zona' ? 22 : 16, tw = label.length * fs * 0.56;
  if (tw <= w - 8 && fs + 6 <= h) {
    g += `<text x="${w/2}" y="${h/2}" dy=".35em" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${tcol}">${esc(label)}</text>`;
  } else if (w > h * 3 && tw <= w + 40) {
    g += `<text x="${w/2}" y="-7" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${cat === 'estructura' ? '#5F5E5A' : col}">${esc(label)}</text>`;
  } else if (h > w * 2.5) {
    g += `<text x="${w + 8}" y="${h/2}" dy=".35em" font-size="${fs}" font-weight="700" fill="${cat === 'truss' ? '#5F5E5A' : col}">${esc(label)}</text>`;
  } else {
    const c2 = cat === 'estructura' || cat === 'zona' ? '#5F5E5A' : col;
    g += `<text x="${w/2}" y="${h + fs + 3}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${c2}">${esc(label)}</text>`;
  }
  if (it.fase) g += `<circle cx="${w}" cy="0" r="11" fill="#1A1A1A"/><text x="${w}" y="0" dy=".35em" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${esc(it.fase)}</text>`;

/* ================= Planta de luces SVG ================= */
const PER = 16, CW = 56, PADX = 30, ROWH = 122;
function estructuraSvgBody(ev, e, start, bad) {
  const L = libMap(), n = e.fx.length, rows = Math.max(1, Math.ceil(n / PER));
  const W = PADX * 2 + PER * CW;
  let s = `<text x="${PADX}" y="28" font-size="20" font-weight="700" fill="#1A1A1A">${esc(e.nombre)}</text>`;
  const meta = [e.tipo === 'truss' && e.largo ? `${r1(e.largo)} m` : '', `${n} equipos`, n ? `Nº ${start} a ${start + n - 1}` : ''].filter(Boolean).join('   |   ');
  s += `<text x="${W - PADX}" y="28" text-anchor="end" font-size="14" fill="#5F5E5A">${esc(meta)}</text>`;
  const Lg = +e.largo || 0, ap = e.tipo === 'truss' ? (+e.aparejos || 0) : 0;
  const apPos = ap === 1 ? [Lg / 2] : [...Array(ap)].map((_, k) => k * Lg / (ap - 1));
  for (let r = 0; r < rows; r++) {
    const y0 = 44 + r * ROWH, c = Math.min(PER, n - r * PER);
    if (c <= 0) break;
    if (e.tipo === 'truss') {
      s += `<rect x="${PADX}" y="${y0 + 14}" width="${c * CW}" height="10" fill="#888780"/>`;
      if (Lg) {
        const m0 = r1(r * PER / n * Lg), m1 = r1((r * PER + c) / n * Lg);
        s += `<text x="${PADX}" y="${y0 + 8}" font-size="11" fill="#5F5E5A">${m0} m</text>`;
        s += `<text x="${PADX + c * CW}" y="${y0 + 8}" text-anchor="end" font-size="11" fill="#5F5E5A">${m1} m</text>`;
        apPos.forEach((m, k) => {
          const idx = m / Lg * n;
          const inRow = idx >= r * PER && (idx < r * PER + c || (r === rows - 1 && idx <= r * PER + c));
          if (!inRow) return;
          const ax = PADX + (idx - r * PER) * CW;
          s += `<circle cx="${ax}" cy="${y0 + 19}" r="6" fill="#1A1A1A"/><text x="${ax}" y="${y0 + 114}" text-anchor="middle" font-size="12" font-weight="700" fill="#1A1A1A">A${k + 1}</text>`;
        });
      }
    }
    for (let i = 0; i < c; i++) {
      const f = e.fx[r * PER + i], l = L[f.lib] || {sigla:'?', color:'#B4B2A9'};
      const cx = PADX + (i + 0.5) * CW, cyy = y0 + 48, num = start + r * PER + i;
      if (e.tipo === 'truss') s += `<line x1="${cx}" y1="${y0 + 24}" x2="${cx}" y2="${cyy - 18}" stroke="#888780" stroke-width="2"/>`;
      s += `<circle cx="${cx}" cy="${cyy}" r="18" fill="${l.color}"/>`;
      s += `<text x="${cx}" y="${cyy}" dy=".35em" text-anchor="middle" font-size="15" font-weight="700" fill="${txtOn(l.color)}">${esc(l.sigla)}</text>`;
      s += `<text x="${cx}" y="${cyy + 34}" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">${num}</text>`;
      const isBad = bad.has(f.id);
      s += `<text x="${cx}" y="${cyy + 51}" text-anchor="middle" font-size="13" font-weight="${isBad ? 700 : 400}" fill="${isBad ? '#C62828' : '#5F5E5A'}">${f.a ? `${f.u || 1}.${pad3(f.a)}` : '—'}</text>`;
    }
  }
  // leyenda
  const cnt = {}; e.fx.forEach(f => cnt[f.lib] = (cnt[f.lib] || 0) + 1);
  const ly = 44 + rows * ROWH + 6; let lx = PADX;
  Object.entries(cnt).forEach(([id, k]) => {
    const l = L[id] || {nombre:'Sin tipo', sigla:'?', color:'#B4B2A9'};
    s += `<circle cx="${lx + 9}" cy="${ly}" r="9" fill="${l.color}"/><text x="${lx + 9}" y="${ly}" dy=".35em" text-anchor="middle" font-size="10" font-weight="700" fill="${txtOn(l.color)}">${esc(l.sigla)}</text>`;
    const t = `${l.nombre}  x${k}`;
    s += `<text x="${lx + 24}" y="${ly + 5}" font-size="14" font-weight="700" fill="#1A1A1A">${esc(t)}</text>`;
    lx += 50 + t.length * 8;
  });
  return {body: s, W, H: ly + 24};
}
function svgWrap(body, W, H, raster, bg = true) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"${raster ? ` width="${W}" height="${H}"` : ''} font-family="Arial, Helvetica, sans-serif">${bg && !raster ? `<rect width="${W}" height="${H}" fill="#fff"/>` : ''}${body}</svg>`;
}
function svgEstructura(ev, ei, raster) {
  const bad = conflictos(ev); let start = 1;
  for (let i = 0; i < ei; i++) start += ev.estructuras[i].fx.length;
  const r = estructuraSvgBody(ev, ev.estructuras[ei], start, bad);
  return svgWrap(r.body, r.W, r.H, raster);
}
function svgPlantaTodo(ev, raster) {
  const bad = conflictos(ev); let start = 1, y = 10, body = '', W = PADX * 2 + PER * CW;
  body += `<text x="${PADX}" y="${y + 22}" font-size="13" fill="#5F5E5A">Número = Fixture ID. Debajo, universo.address DMX.</text>`; y += 34;
  ev.estructuras.forEach(e => {

}
function txtOn(hex) {
  const h = hex.replace('#', ''); const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16));
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? '#1A1A1A' : '#FFFFFF';
}

function fxSheet(ei, fi) {
  const ev = curEv(), e = ev.estructuras[ei]; if (!e || !e.fx[fi]) return closeSheet();
  const f = e.fx[fi], L = libMap(), l = L[f.lib];
  const all = allFx(ev), me = all.find(x => x.f.id === f.id), b = `estructuras.${ei}.fx.${fi}`;
  const rango = f.a && l && l.canales ? `Ocupa ${f.u || 1}.${pad3(f.a)} a ${f.u || 1}.${pad3(+f.a + l.canales - 1)}` : '';
  // sugerido: siguiente libre después de la luz anterior
  let sug = null;
  const prev = all[me.n - 2];
  if (prev && prev.f.a && L[prev.f.lib] && L[prev.f.lib].canales) {
    let u = prev.f.u || 1, a = +prev.f.a + L[prev.f.lib].canales;
    const ch = (l && l.canales) || 1; if (a + ch - 1 > 512) { u++; a = 1; }
    sug = {u, a};
  }
  openSheet(`<h3>Luz ${me.n} en ${esc(e.nombre)}</h3>
    <label class="field"><span>Tipo</span><select data-p="${b}.lib" data-r="luces">${DB.biblioteca.map(x => `<option value="${x.id}" ${x.id === f.lib ? 'selected' : ''}>${esc(x.nombre)}${x.canales ? ` (${x.canales} canales)` : ''}</option>`).join('')}</select></label>
    <div class="grid2">
      <label class="field"><span>Universo</span><input type="number" min="1" max="64" data-p="${b}.u" data-num data-r="luces" value="${f.u || 1}"></label>
      <label class="field"><span>Address</span><input type="number" min="1" max="512" id="fxAddr" data-p="${b}.a" data-num data-r="luces" value="${f.a ?? ''}" inputmode="numeric"></label>
    </div>
    ${rango ? `<p class="hint">${rango}</p>` : ''}
    ${sug && !f.a ? `<button class="btn sm" style="margin-bottom:12px" data-a="usarSug" data-e="${ei}" data-i="${fi}" data-u="${sug.u}" data-ad="${sug.a}">Usar ${sug.u}.${pad3(sug.a)} (sigue a la anterior)</button>` : ''}
    <div class="row" style="margin-bottom:12px"><button class="btn sm" data-a="mvFx" data-e="${ei}" data-i="${fi}" data-d="-1">Mover a la izquierda</button><button class="btn sm" data-a="mvFx" data-e="${ei}" data-i="${fi}" data-d="1">Mover a la derecha</button></div>
    <div class="row"><button class="btn danger" data-a="delFx" data-e="${ei}" data-i="${fi}">Borrar luz</button>
      <button class="btn pri" style="flex:1" data-a="nextFx" data-n="${me.n}">${me.n < all.length ? 'Siguiente luz' : 'Listo'}</button></div>`);
}

function calcSheet() {
  const ev = curEv(), L = libMap();
  let nu = 1, na = 1;
  allFx(ev).forEach(({f}) => { if (!f.a) return; const u = f.u || 1, fin = +f.a + ((L[f.lib] && L[f.lib].canales) || 1);
    if (u > nu || (u === nu && fin > na)) { nu = u; na = fin; } });
  if (na > 512) { nu++; na = 1; }
  openSheet(`<h3>Calculador de address</h3>
    <p class="hint">Asigna los address en orden, según los canales de cada tipo de luz. Si pasa de 512, sigue en el universo siguiente.</p>
    <div class="grid2">
      <label class="field"><span>Universo inicial</span><input type="number" id="cU" min="1" value="${nu}"></label>
      <label class="field"><span>Address inicial</span><input type="number" id="cA" min="1" max="512" value="${na}"></label>
    </div>
    <label class="field"><span>Aplicar a</span><select id="cE"><option value="-1">Todas las estructuras</option>${ev.estructuras.map((e, i) => `<option value="${i}">${esc(e.nombre)}</option>`).join('')}</select></label>
    <label class="chk" style="margin-bottom:16px"><input type="checkbox" id="cV" checked style="accent-color:var(--lime)">Solo las luces sin address</label>
    <button class="btn pri" style="width:100%" data-a="runCalc">Asignar address</button>`);
}
function runCalc() {
  const ev = curEv(), L = libMap();
  let u = +$('#cU').value || 1, a = +$('#cA').value || 1;
  const ei = +$('#cE').value, soloV = $('#cV').checked;
  const scope = allFx(ev).filter(x => (ei < 0 || x.ei === ei) && (!soloV || !x.f.a));
  if (!scope.length) return toast('No hay luces para asignar');
  const falta = [...new Set(scope.filter(x => !(L[x.f.lib] && L[x.f.lib].canales)).map(x => (L[x.f.lib] || {nombre:'Sin tipo'}).nombre))];
  if (falta.length) return toast(`Cargá los canales de ${falta.join(', ')} en la Biblioteca de luces`);
  scope.forEach(x => {
    const ch = L[x.f.lib].canales;
    if (a + ch - 1 > 512) { u++; a = 1; }
    x.f.u = u; x.f.a = a; a += ch;
  });
  save(); closeSheet(); render(); toast(`Listo: ${scope.length} luces con address`);
}

function openSheet(html) { const s = $('#sheet'); s.innerHTML = '<div class="grab"></div>' + html; $('#sheetBg').style.display = 'block'; requestAnimationFrame(() => s.classList.add('on')); }
function closeSheet() { $('#sheet').classList.remove('on'); $('#sheetBg').style.display = 'none'; }

/* ================= Inputs ================= */
function setPath(obj, path, val) {
  const k = path.split('.'); let o = obj;
  for (let i = 0; i < k.length - 1; i++) o = o[/^\d+$/.test(k[i]) ? +k[i] : k[i]];
  o[/^\d+$/.test(k.at(-1)) ? +k.at(-1) : k.at(-1)] = val;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.grp !== undefined) {
    const ev = curEv(), old = el.dataset.grp, nv = el.value;
    ev.equipos.forEach(x => { if (x.g === old) x.g = nv; });
    el.dataset.grp = nv; el.nextElementSibling.dataset.g = nv; saveSoon(); return;
  }
  if (!el.dataset.p) return;
  const obj = el.dataset.o === 'lib' ? DB.biblioteca : curEv(); if (!obj) return;
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.dataset.lines !== undefined) v = el.value.split('\n').map(s => s.trim()).filter(Boolean);
  else if (el.dataset.num !== undefined) v = el.value === '' ? null : Number(el.value);
  else v = el.value;
  if (el.dataset.num !== undefined && el.closest('.card.selp') && (v === null || v <= 0) && /\.(w|h)$/.test(el.dataset.p)) return;
  if (/^plano\.(ancho|largo)$/.test(el.dataset.p) && (!v || v < 2)) return;
  setPath(obj, el.dataset.p, v);
  saveSoon();
  const r = el.dataset.r;
  if (r === 'plano') drawPlano();
  else if (r === 'title') $('#topbar h1').textContent = v;
  else if (r === 'luces') { save(); const y = scrollY; render(); scrollTo(0, y); }
  else if (r === 'lib') { save(); }
});

$('#fileFoto').onchange = e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 1200 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    curEv().plano.fondo = c.toDataURL('image/jpeg', 0.6); save(); render();
  }; im.src = rd.result; };
  rd.readAsDataURL(file);
};
$('#fileJson').onchange = e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  file.text().then(t => {
    const d = JSON.parse(t); if (!d || !Array.isArray(d.eventos)) throw 0;
    d.eventos.forEach(ev => { const i = DB.eventos.findIndex(x => x.id === ev.id); if (i >= 0) DB.eventos[i] = ev; else DB.eventos.push(ev); });
    (d.biblioteca || []).forEach(l => { if (!DB.biblioteca.some(x => x.id === l.id)) DB.biblioteca.push(l); });
    save(); closeSheet(); render(); toast(`Respaldo cargado: ${d.eventos.length} hojas de ruta`);
  }).catch(() => toast('Ese archivo no es un respaldo de hojas de ruta'));
};

/* ================= Exportar: imágenes y PDF ================= */
function loadImg(src) { return new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; }); }
async function svgCanvas(svg, widthPx, bg) {
  const m = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/), vw = +m[1], vh = +m[2], k = widthPx / vw;
  const c = document.createElement('canvas'); c.width = Math.round(widthPx); c.height = Math.round(vh * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  if (bg) { const im = await loadImg(bg.src); ctx.globalAlpha = 0.55; ctx.drawImage(im, bg.x * k, bg.y * k, bg.w * k, bg.h * k); ctx.globalAlpha = 1; }
  const im = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
  ctx.drawImage(im, 0, 0, c.width, c.height);
  return c;
}
function planoCanvas(ev) {
  const P = ev.plano;
  return svgCanvas(svgPlano(ev, {raster:true}), 1600, P.fondo ? {src:P.fondo, x:X(0), y:X(0), w:P.ancho * S, h:P.largo * S} : null);
}
const toBlob = c => new Promise(ok => c.toBlob(ok, 'image/png'));
const slug = s => (s || 'evento').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '_').replace(/^_|_$/g, '');

async function buildPDF(ev) {
  const {jsPDF} = window.jspdf, d = new jsPDF({unit:'pt', format:'a4'});
  const PW = 595.28, PH = 841.89, M = 36, BOT = PH - 56;
  const K = {dark:[26,26,26], lime:[195,209,24], gray:[95,94,90], light:[241,239,232], line:[180,178,169], ambBg:[250,238,218], ambTx:[133,79,11], amb:[239,159,39], white:[255,255,255]};
  const F = c => d.setFillColor(...c), TC = c => d.setTextColor(...c), DC = c => d.setDrawColor(...c);
  const font = (w, s) => { d.setFont('helvetica', w); d.setFontSize(s); };
  const fechaTxt = ev.fecha ? fmtFecha(ev.fecha) : '';
  let y = 0, sub = '';
  function header(s) {
    sub = s; F(K.dark); d.rect(0, 0, PW, 70, 'F'); F(K.lime); d.rect(0, 70, PW, 4, 'F');
    font('bold', 20); TC(K.lime); d.text('TESORO EVENTOS', M, 38);
    font('normal', 11); TC(K.white); d.text(`HOJA DE RUTA  ·  ${ev.nombre.toUpperCase()}  ·  ${s}`, M, 56);
    if (fechaTxt) { font('bold', 12); d.text(fechaTxt, PW - M, 38, {align:'right'}); }
    y = 108;
  }
  function page(s) { d.addPage(); header(s); }
  function need(h) { if (y + h > BOT) page(sub); }
  function section(t) { need(40); F(K.lime); d.rect(M, y - 12, 4, 16, 'F'); font('bold', 14); TC(K.dark); d.text(t, M + 10, y); y += 24; }
  function tag(x, yy, t, s = 10) { font('bold', s); const w = d.getTextWidth(t) + 12; F(K.ambBg); DC(K.amb); d.roundedRect(x, yy - s, w, s + 7, 3, 3, 'FD'); TC(K.ambTx); d.text(t, x + 6, yy); return w; }

  // ---- Página 1: resumen
  header('RESUMEN');
  section('El evento');
  [['Cliente', ev.cliente], ['Lugar', ev.lugar], ['Dirección', ev.direccion], ['Contacto en el lugar', ev.contacto], ['Servicio', ev.servicio]].forEach(([k, v]) => {
    const lines = v ? (font('bold', 12), d.splitTextToSize(v, PW - M - 170)) : [''];
    need(lines.length * 15 + 7); font('bold', 12);
    font('normal', 11); TC(K.gray); d.text(k, M + 10, y);
    if (v) { font('bold', 12); TC(K.dark); d.text(lines, 170, y); } else tag(170, y, 'A CONFIRMAR');
    y += lines.length * 15 + 7;
  });
  y += 10; section('Cronograma');
  ev.cronograma.forEach((c, i) => {
    font('normal', 11); const tw = c.conf ? 260 : PW - M - 180; const lines = d.splitTextToSize(c.texto || '', tw);
    need(lines.length * 14 + 8); font('normal', 11);
    if (c.dia && i > 0) { DC(K.line); d.setLineWidth(0.5); d.line(M + 10, y - 14, PW - M, y - 14); }
    font('bold', 12); TC(K.dark); if (c.dia) d.text(c.dia, M + 10, y);
    font('bold', 13); if (c.hora) d.text(c.hora, 130, y);
    font('normal', 11); d.text(lines, 180, y);
    if (c.conf) { font('normal', 11); tag(180 + Math.min(tw, d.getTextWidth(lines[0] || '')) + 8, y, 'HORARIO A CONFIRMAR', 9); }
    y += lines.length * 14 + 8;
  });
  y += 10; section('Equipo de trabajo');
  if (ev.armado.length) {
    need(60); font('bold', 11); TC(K.gray); d.text('ARMADO', M + 10, y); y += 12;
    let x = M + 10;
    ev.armado.forEach(n => {
      font('bold', 12); const w = Math.max(80, d.getTextWidth(n) + 24);
      if (x + w > PW - M) { x = M + 10; y += 38; need(40); }
      const resp = ev.responsable && n.trim().toLowerCase() === ev.responsable.trim().toLowerCase();
      F(resp ? K.dark : K.light); d.roundedRect(x, y, w, 30, 4, 4, 'F');
      TC(resp ? K.lime : K.dark); d.text(n, x + w / 2, resp ? y + 14 : y + 19, {align:'center'});
      if (resp) { font('bold', 7); TC(K.white); d.text('RESPONSABLE', x + w / 2, y + 24, {align:'center'}); }
      x += w + 8;
    });
    y += 52;
  }
  if (ev.durante.length) {
    need(40); font('bold', 11); TC(K.gray); d.text('DURANTE EL EVENTO', M + 10, y); y += 20;
    ev.durante.forEach(p => { need(20); font('bold', 12); TC(K.dark); d.text(p.nombre || '', M + 10, y); font('normal', 11); d.text(p.tarea || '', 130, y); y += 19; });
  }
  if (ev.reglas.length) {
    y += 12; section('Reglas del día');
    ev.reglas.forEach(r => {
      font('normal', 11); const lines = d.splitTextToSize(r, PW - M - 70); need(lines.length * 14 + 6); font('normal', 11);
      F(K.lime); d.circle(M + 14, y - 4, 2.5, 'F'); TC(K.dark); d.text(lines, M + 24, y); y += lines.length * 14 + 6;
    });
  }

  // ---- Plano
  if (ev.plano.items.length) {
    page('PLANO DE UBICACIÓN'); section('Vista de arriba');
    const c = await planoCanvas(ev);
    const maxW = PW - 2 * M, maxH = BOT - y - 4, k = Math.min(maxW / c.width, maxH / c.height);
    const w = c.width * k, h = c.height * k;
    d.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', (PW - w) / 2, y, w, h);
  }

  // ---- Planta de luces
  const fx = allFx(ev);
  if (fx.length) {
    page('PLANTA DE LUCES');
    font('normal', 10); TC(K.gray); d.text('Número = Fixture ID en la consola. Debajo de cada luz: universo.address DMX.', M + 10, y - 6); y += 8;
    for (let i = 0; i < ev.estructuras.length; i++) {
      if (!ev.estructuras[i].fx.length) continue;
      const c = await svgCanvas(svgEstructura(ev, i, true), 1600);
      const w = PW - 2 * M, h = c.height * w / c.width;
      if (y + h > BOT) page('PLANTA DE LUCES');
      d.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', M, y, w, h); y += h + 14;
    }
    // Patch
    const L = libMap(), bad = conflictos(ev), cols = [M + 10, M + 60, M + 170, M + 330, M + 430];
    const head = () => { font('bold', 9); TC(K.gray); ['Nº', 'EQUIPO', 'ESTRUCTURA', 'DMX (U.ADDR)', 'CANALES'].forEach((t, i) => d.text(t, cols[i], y)); y += 16; };
    if (y + 80 > BOT) page('PATCH DMX');
    section('Patch DMX'); head();
    fx.forEach(({f, e, n}) => {
      if (y + 16 > BOT) { page('PATCH DMX'); head(); }
      const l = L[f.lib] || {nombre:'Sin tipo', canales:null};
      if (n % 2) { F(K.light); d.rect(M + 4, y - 11, PW - 2 * M - 4, 16, 'F'); }
      font('bold', 10); TC(K.dark); d.text(String(n), cols[0], y);
      font('normal', 10); d.text(l.nombre, cols[1], y); d.text(d.splitTextToSize(e.nombre, 150)[0], cols[2], y);
      if (f.a) { if (bad.has(f.id)) TC([198,40,40]); font('bold', 10); d.text(`${f.u || 1}.${pad3(f.a)}`, cols[3], y); TC(K.dark); }
      else { TC(K.ambTx); font('bold', 10); d.text('A CONFIRMAR', cols[3], y); TC(K.dark); }
      font('normal', 10); d.text(l.canales ? String(l.canales) : '-', cols[4], y);
      y += 16;
    });
  }

  // ---- Lista de equipos
  page('LISTA DE EQUIPOS'); section('Marcar al cargar en depósito y al volver');
  const cx1 = 460, cx2 = 520;
  font('bold', 9); TC(K.gray); d.text('CANT.', 380, y - 4); d.text('CARGA', cx1 + 7, y - 4, {align:'center'}); d.text('VUELTA', cx2 + 7, y - 4, {align:'center'}); y += 8;
  const grp = t => { need(46); F(K.dark); d.rect(M + 10, y - 12, PW - 2 * M - 10, 18, 'F'); font('bold', 10); TC(K.lime); d.text(t.toUpperCase(), M + 18, y + 1); y += 24; };
  const item = (n, c) => {
    font('normal', 11); const lines = d.splitTextToSize(n || '', 300); need(lines.length * 13 + 9);
    font('normal', 11); TC(K.dark); d.text(lines, M + 18, y); font('bold', 12); d.text(String(c ?? ''), 380, y);
    DC(K.dark); d.setLineWidth(0.8); d.rect(cx1, y - 10, 14, 14); d.rect(cx2, y - 10, 14, 14);
    DC(K.line); d.setLineWidth(0.5); const yy = y + (lines.length - 1) * 13 + 7; d.line(M + 10, yy, PW - M, yy); y = yy + 15;
  };
  const Lm = libMap();
  ev.estructuras.forEach(e => {
    if (!e.fx.length) return; grp('Iluminación: ' + e.nombre);
    const cnt = {}; e.fx.forEach(f => cnt[f.lib] = (cnt[f.lib] || 0) + 1);
    Object.entries(cnt).forEach(([id, k]) => item((Lm[id] || {nombre:'Sin tipo'}).nombre, k));
  });
  const groups = []; ev.equipos.forEach(x => { if (x.n && !groups.includes(x.g)) groups.push(x.g); });
  groups.forEach(g => { grp(g || 'Otros'); ev.equipos.filter(x => x.g === g && x.n).forEach(x => item(x.n, x.c)); });
  if (ev.checklist.length) {
    y += 8; section('Checklist del armado');
    ev.checklist.forEach(t => {
      font('normal', 11); const lines = d.splitTextToSize(t, PW - M - 90); need(lines.length * 14 + 6); font('normal', 11);
      DC(K.dark); d.setLineWidth(0.8); d.rect(M + 18, y - 10, 12, 12); TC(K.dark); d.text(lines, M + 38, y); y += lines.length * 14 + 6;
    });
  }

  // ---- Pie
  const N = d.getNumberOfPages(), resp = ev.responsable ? ev.responsable.toUpperCase() : 'A CONFIRMAR';
  for (let i = 1; i <= N; i++) {
    d.setPage(i); DC(K.line); d.setLineWidth(0.5); d.line(M, PH - 40, PW - M, PH - 40);
    font('normal', 9); TC(K.gray);
    d.text(`Responsable en el lugar: ${resp}${ev.responsable ? `  ·  Ante cualquier duda, primero ${ev.responsable}` : ''}`, M, PH - 28);
    d.text(`Página ${i} de ${N}`, PW - M, PH - 28, {align:'right'});
  }
  return d.output('blob');
}

let prepared = null;
async function shareSheet() {
  const ev = curEv(); save();
  openSheet(`<h3>Generar y compartir</h3><p class="hint" id="shMsg">Preparando los archivos…</p><div class="stack" id="shBtns"></div>`);
  try {
    const base = `${slug(ev.nombre)}${ev.fecha ? '_' + ev.fecha.slice(8, 10) + '-' + ev.fecha.slice(5, 7) : ''}`;
    const files = {};
    files.pdf = new File([await buildPDF(ev)], `Hoja_de_ruta_${base}.pdf`, {type:'application/pdf'});
    if (ev.plano.items.length) files.plano = new File([await toBlob(await planoCanvas(ev))], `Plano_${base}.png`, {type:'image/png'});
    if (allFx(ev).length) files.planta = new File([await toBlob(await svgCanvas(svgPlantaTodo(ev, true), 1600))], `Planta_de_luces_${base}.png`, {type:'image/png'});
    prepared = {files, title:`Hoja de ruta ${ev.nombre}`};
    const p = pendientes(ev);
    $('#shMsg').innerHTML = p.length ? `Listo. Ojo: quedan ${p.length} pendientes, salen marcados como A CONFIRMAR.` : 'Listo para mandar al grupo.';
    $('#shBtns').innerHTML = `<button class="btn pri" data-a="share" data-k="todo">Compartir PDF e imágenes</button>
      <button class="btn" data-a="share" data-k="pdf">Compartir solo el PDF</button>
      ${files.plano ? '<button class="btn" data-a="share" data-k="plano">Compartir imagen del plano</button>' : ''}
      ${files.planta ? '<button class="btn" data-a="share" data-k="planta">Compartir imagen de la planta de luces</button>' : ''}
      <button class="btn" data-a="share" data-k="bajar">Descargar el PDF</button>`;
  } catch (err) {
    console.error(err);
    $('#shMsg').textContent = !window.jspdf ? 'Falta cargar el generador de PDF. Abrí la app una vez con internet y volvé a intentar.' : 'No se pudo generar el PDF: ' + err.message;
  }
}
async function doShare(k) {
  if (!prepared) return; const F = prepared.files;
  if (k === 'bajar') return descargar(F.pdf, F.pdf.name);
  const list = k === 'todo' ? Object.values(F) : [F[k]];
  if (navigator.canShare && navigator.canShare({files:list})) {
    try { await navigator.share({files:list, title:prepared.title}); } catch (e) { if (e.name !== 'AbortError') toast('No se pudo compartir: ' + e.message); }
  } else { list.forEach(f => descargar(f, f.name)); toast('Este navegador no comparte archivos: se descargaron'); }
}
function descargar(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ================= Inicio ================= */
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.__hr = {DB, cur, buildPDF, A, render};
</script>
